# Dedicated datasource for Flyway learning only
spring.datasource.url=jdbc:postgresql://localhost:5432/employee_management_flyway_lab_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Do not allow Hibernate to create or modify the lab schema
spring.jpa.hibernate.ddl-auto=none

# Enable Flyway only for this profile
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration-lab

# Safety and validation settings
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
